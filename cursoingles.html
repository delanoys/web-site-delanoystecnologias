<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Plan de Aprendizaje de Inglés - 4 Semanas</title>
    <link rel="stylesheet" href="/estilos/cursoingles.css">
</head>
<body>
    <header>
        <h1>Plan de 4 Semanas para Aprender Inglés</h1>
        <p>Mejora tu pronunciación, escritura, lectura y escucha</p>
    </header>

    <main>
        <!-- Plan Semanal -->
        <section id="plan">
            <h2>Plan Semanal</h2>
            <div id="weeks"></div>
        </section>

        <!-- Actividad de Pronunciación -->
        <section id="pronunciation">
            <h2>Pronunciación</h2>
            <input type="text" id="wordInput" placeholder="Escribe una palabra o frase en inglés">
            <button id="speakBtn">Pronunciar</button>
        </section>

        <!-- Actividad de Escritura -->
        <section id="writing">
            <h2>Práctica de Escritura</h2>
            <p id="writingPrompt"></p>
            <textarea id="writingArea" placeholder="Escribe tu respuesta aquí"></textarea>
            <button id="checkWriting">Verificar</button>
            <p id="writingFeedback"></p>
        </section>

        <!-- Actividad de Escucha -->
        <section id="listening">
            <h2>Práctica de Escucha</h2>
            <button id="playAudio">Reproducir audio</button>
            <input type="text" id="listeningAnswer" placeholder="Escribe lo que escuchaste">
            <button id="checkListening">Comprobar</button>
            <p id="listeningFeedback"></p>
        </section>
    </main>

    <footer>
        <p>© 2025 Plan Interactivo de Inglés</p>
    </footer>

    <script src="/JavaScrpt/cursoingles.js"></script>
</body>
</html>
