<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test de Bienestar Emocional</title>
    <style>
        body { font-family: sans-serif; background: #e9ecef; padding: 20px; }
        .quiz-card { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; }
        .question { margin-bottom: 20px; font-weight: bold; }
        .options label { display: block; background: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; border: 1px solid #ddd; }
        #final-score { display: none; text-align: center; margin-top: 20px; padding: 20px; background: #d4edda; border-radius: 10px; }
        button { background: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="quiz-card">
    <h2>Encuesta de Salud Emocional</h2>
    <p>Responde con total sinceridad. Nadie más verá estas respuestas.</p>
    <hr>
    
    <div id="quiz">
        <div class="question">1. Cuando alguien me critica injustamente, yo:</div>
        <div class="options">
            <label><input type="radio" name="q1" value="0"> Exploto y respondo igual de fuerte.</label>
            <label><input type="radio" name="q1" value="5"> Me quedo callado pero con mucho rencor.</label>
            <label><input type="radio" name="q1" value="10"> Respiro y trato de responder con calma.</label>
        </div>

        <div class="question">2. Al enfrentar un problema difícil, mi tendencia es:</div>
        <div class="options">
            <label><input type="radio" name="q2" value="0"> Quejarme y decir que no puedo.</label>
            <label><input type="radio" name="q2" value="10"> Buscar sabiduría y consejo de alguien mayor.</label>
            <label><input type="radio" name="q2" value="5"> Intentar resolverlo solo aunque me estrese.</label>
        </div>

        <div class="question">3. ¿Qué tanto controlas lo que dices cuando estás enojado?</div>
        <div class="options">
            <label><input type="radio" name="q3" value="10"> Casi siempre pienso antes de hablar.</label>
            <label><input type="radio" name="q3" value="0"> Digo lo primero que me viene a la mente.</label>
        </div>

        <button onclick="calculateScore()">Ver mi Resultado</button>
    </div>

    <div id="final-score">
        <h3 id="score-title"></h3>
        <p id="score-verse"></p>
        <p id="score-advice"></p>
        <a href="proverbios.html" style="display:inline-block; margin-top:10px; color:#2980b9;">Volver al reto de 31 días</a>
    </div>
</div>

<script>
    function calculateScore() {
        let score = 0;
        const radios = document.querySelectorAll('input[type="radio"]:checked');
        if (radios.length < 3) { alert("Por favor responde todas las preguntas"); return; }
        
        radios.forEach(r => score += parseInt(r.value));
        
        document.getElementById('quiz').style.display = 'none';
        const res = document.getElementById('final-score');
        res.style.display = 'block';

        if(score >= 25) {
            document.getElementById('score-title').innerText = "¡Vas por buen camino!";
            document.getElementById('score-verse').innerText = "Proverbios 16:32: 'Mejor es el que tarda en airarse que el fuerte'.";
            document.getElementById('score-advice').innerText = "Tu inteligencia emocional es alta. Sigue alimentando tu espíritu con la Palabra.";
        } else {
            document.getElementById('score-title').innerText = "Es tiempo de trabajar en tu corazón";
            document.getElementById('score-verse').innerText = "Proverbios 4:23: 'Sobre toda cosa guardada, guarda tu corazón'.";
            document.getElementById('score-advice').innerText = "A veces las emociones nos ganan. El libro de Proverbios será tu mejor gimnasio para fortalecer tu carácter.";
        }
    }
</script>
</body>
</html>
