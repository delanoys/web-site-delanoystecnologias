<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline IA Pro - Delanoys Tecnologías</title>
<meta name="description" content="Metodología de desarrollo distribuido con IAs especializadas">
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-card: #1e293b;
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --border: #334155;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #f59e0b;
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e3a8a 100%);
    padding: 60px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, transparent 70%);
    animation: pulse 8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }
  header h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
    position: relative;
    z-index: 1;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  header p {
    color: var(--text-secondary);
    margin-top: 12px;
    font-size: 1.1rem;
    position: relative;
    z-index: 1;
  }
  nav {
    background: var(--bg-secondary);
    padding: 15px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
  }
  nav ul {
    list-style: none;
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }
  nav a {
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
    padding: 5px 10px;
    border-radius: 6px;
  }
  nav a:hover { color: var(--accent); background: rgba(56,189,248,0.1); }
  main {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
  }
  section { margin-bottom: 50px; scroll-margin-top: 80px; }
  h2 {
    color: var(--accent);
    font-size: 1.8rem;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h2::before { content: '▸'; color: var(--accent); }
  .card {
    background: var(--bg-card);
    padding: 25px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: transform 0.3s, border-color 0.3s;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .timeline {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .phase-card {
    background: var(--bg-card);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
  }
  .phase-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: var(--accent);
    transform: scaleY(0);
    transform-origin: top;
    transition: transform 0.3s;
  }
  .phase-card:hover::before { transform: scaleY(1); }
  .phase-card:hover {
    background: #243447;
    transform: translateX(5px);
  }
  .phase-card h3 {
    color: var(--text-primary);
    margin: 10px 0;
    font-size: 1.2rem;
  }
  .phase-card .content {
    color: var(--text-secondary);
    font-size: 0.95rem;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .phase-card.active .content { max-height: 500px; margin-top: 10px; }
  .phase-card ul { padding-left: 20px; margin-top: 8px; }
  .phase-card li { margin: 4px 0; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), #818cf8);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .roles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
  }
  .role-card {
    background: var(--bg-card);
    padding: 25px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .role-card h3 {
    color: var(--accent);
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .security-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .security-box {
    background: var(--bg-card);
    padding: 20px;
    border-radius: 12px;
    border-left: 4px solid;
  }
  .security-box.danger { border-color: var(--danger); }
  .security-box.success { border-color: var(--success); }
  .security-box h4 { margin-bottom: 12px; font-size: 1.1rem; }
  .security-box.danger h4 { color: var(--danger); }
  .security-box.success h4 { color: var(--success); }
  .security-box ul { list-style: none; }
  .security-box li {
    padding: 6px 0;
    padding-left: 25px;
    position: relative;
    color: var(--text-secondary);
  }
  .security-box.danger li::before { content: '✕'; position: absolute; left: 0; color: var(--danger); font-weight: bold; }
  .security-box.success li::before { content: '✓'; position: absolute; left: 0; color: var(--success); font-weight: bold; }
  .architecture {
    background: var(--bg-card);
    padding: 30px;
    border-radius: 12px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .arch-flow {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
  }
  .arch-node {
    background: linear-gradient(135deg, #1e3a8a, #312e81);
    padding: 12px 20px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    font-weight: 500;
    transition: transform 0.3s;
  }
  .arch-node:hover { transform: scale(1.05); }
  .arch-arrow { color: var(--accent); font-size: 1.5rem; }
  footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
    margin-top: 60px;
  }
  .error {
    background: rgba(239,68,68,0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 20px;
    border-radius: 12px;
    text-align: center;
  }
  @media (max-width: 640px) {
    header { padding: 40px 15px; }
    main { padding: 20px 15px; }
    .arch-arrow { transform: rotate(90deg); }
  }
</style>
</head>
<body>

<header>
  <h1>Pipeline IA Pro</h1>
  <p>Metodología de desarrollo distribuido para Delanoys Tecnologías</p>
</header>

<nav>
  <ul>
    <li><a href="/">© 2026 Delanoys Tecnologías</a></li>

    <li><a href="#objetivo">Objetivo</a></li>
    <li><a href="#roles">Roles</a></li>
    <li><a href="#fases">Fases</a></li>
    <li><a href="#seguridad">Seguridad</a></li>
    <li><a href="#arquitectura">Arquitectura</a></li>
  </ul>
</nav>

<main id="content">
  <!-- El contenido Pipeline de IAs se genera dinámicamente con JavaScript -->
</main>

<footer>
  <p>© 2026 Delanoys Tecnologías · Pipeline IA Pro v1.0</p>
</footer>

<script>
// ============================================================
// DATOS EMBEBIDOS (para sitio estático)
// ============================================================
const pipelineData = {
  objetivo: "Sistema de trabajo donde las IAs actúan como equipo técnico y tutor para desarrollar proyectos reales, aprender durante el proceso y desplegar soluciones en VPS propio.",
  
  roles: {
    usuario: [
      "Director del proyecto",
      "Toma decisiones finales",
      "Ejecuta cambios en producción",
      "Aprende la lógica y arquitectura"
    ],
    equipoIA: [
      "Tutor técnico",
      "Arquitecto",
      "Revisor",
      "Documentador",
      "Proponente de mejoras"
    ]
  },
  
  fases: [
    {
      numero: "0",
      nombre: "Infraestructura",
      ias: "GPT + Claude",
      tareas: [
        "Definir: VPS, Docker, Dominios, SSL, Backups",
        "Estrategia de despliegue"
      ]
    },
    {
      numero: "1",
      nombre: "Definición",
      ias: "Grok + GPT",
      tareas: [
        "Ideas",
        "Alcance",
        "Roadmap"
      ]
    },
    {
      numero: "2",
      nombre: "Validación",
      ias: "Claude + Qwen",
      tareas: [
        "Seguridad",
        "Arquitectura",
        "Permisos",
        "Coherencia técnica"
      ]
    },
    {
      numero: "3",
      nombre: "Implementación",
      ias: "DeepSeek",
      tareas: [
        "Dockerfile",
        "Docker Compose",
        "Scripts",
        "PostgreSQL",
        "MySQL",
        "Automatización"
      ]
    },
    {
      numero: "4",
      nombre: "Revisión",
      ias: "Claude",
      tareas: [
        "Seguridad",
        "Errores críticos",
        "Riesgos"
      ]
    },
    {
      numero: "5",
      nombre: "Ejecución",
      ias: "Usuario",
      tareas: [
        "Deploy",
        "Pruebas",
        "Validación"
      ]
    },
    {
      numero: "6",
      nombre: "Debug",
      ias: "DeepSeek + Claude",
      tareas: []
    },
    {
      numero: "7",
      nombre: "Optimización",
      ias: "GPT",
      tareas: [
        "Documentación",
        "Organización",
        "Escalabilidad"
      ]
    },
    {
      numero: "8",
      nombre: "Automatización",
      ias: "Preferencia",
      tareas: [
        "Dockploy",
        "Docker Compose",
        "CI/CD"
      ]
    }
  ],
  
  seguridad: {
    prohibido: [
      "Contraseñas visibles",
      "Tokens visibles",
      "API Keys visibles",
      "Credenciales en código",
      "Secretos en logs"
    ],
    obligatorio: [
      "Variables .env",
      ".gitignore",
      "Variables de entorno en VPS",
      "Secret managers cuando existan",
      "Inputs protegidos"
    ]
  },
  
  estrategiaVPS: {
    servicios: [
      "Sitio web corporativo",
      "Inventario",
      "Chatbots",
      "APIs",
      "Bases de datos",
      "Automatizaciones"
    ],
    arquitectura: [
      "Internet",
      "Nginx / Proxy",
      "Dockploy",
      "Contenedores Docker",
      "Bases de datos",
      "Backups"
    ]
  },
  
  objetivoFinal: "Construir un ecosistema tecnológico propio, escalable y documentado, aprendiendo durante cada etapa del desarrollo."
};

// ============================================================
// RENDERIZADOR
// ============================================================
function renderPipeline() {
  const data = pipelineData;
  
  return `
    <section id="objetivo">
      <h2>🎯 Objetivo General</h2>
      <div class="card">
        <p style="font-size: 1.1rem;">${data.objetivo}</p>
      </div>
    </section>

    <section id="roles">
      <h2>👥 Roles del Equipo</h2>
      <div class="roles-grid">
        <div class="role-card">
          <h3>👤 Usuario</h3>
          <ul style="padding-left: 20px; color: var(--text-secondary);">
            ${data.roles.usuario.map(r => `<li>${r}</li>`).join('')}
          </ul>
        </div>
        <div class="role-card">
          <h3>🤖 Equipo IA</h3>
          <ul style="padding-left: 20px; color: var(--text-secondary);">
            ${data.roles.equipoIA.map(r => `<li>${r}</li>`).join('')}
          </ul>
        </div>
      </div>
    </section>

    <section id="fases">
      <h2>🔄 Pipeline de IAs</h2>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">
        Haz clic en cada fase para ver los detalles.
      </p>
      <div class="timeline">
        ${data.fases.map(f => `
          <div class="phase-card" onclick="this.classList.toggle('active')">
            <span class="badge">F${f.numero}</span>
            <h3>${f.nombre}</h3>
            <div class="content">
              ${f.ias ? `<p><strong>IAs:</strong> ${f.ias}</p>` : ''}
              ${f.tareas && f.tareas.length ? `
                <ul>
                  ${f.tareas.map(t => `<li>${t}</li>`).join('')}
                </ul>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </section>

    <section id="seguridad">
      <h2>🔒 Regla Crítica de Seguridad</h2>
      <div class="security-grid">
        <div class="security-box danger">
          <h4>⛔ PROHIBIDO</h4>
          <ul>
            ${data.seguridad.prohibido.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>
        <div class="security-box success">
          <h4>✅ OBLIGATORIO</h4>
          <ul>
            ${data.seguridad.obligatorio.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>
      </div>
      <div class="card" style="margin-top: 20px; border-left: 4px solid var(--warning);">
        <p style="color: var(--warning); font-weight: 600;">
          ⚠️ Esta regla NO puede ser ignorada en ningún proyecto.
        </p>
      </div>
    </section>

    <section id="arquitectura">
      <h2>🏗️ Estrategia VPS y Arquitectura</h2>
      <div class="card" style="margin-bottom: 20px;">
        <h3 style="color: var(--accent); margin-bottom: 12px;">Servicios Previstos</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
          ${data.estrategiaVPS.servicios.map(s => `
            <span style="background: rgba(56,189,248,0.1); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent);">
              ${s}
            </span>
          `).join('')}
        </div>
      </div>
      <div class="architecture">
        <h3 style="color: var(--accent);">Flujo de Arquitectura</h3>
        <div class="arch-flow">
          ${data.estrategiaVPS.arquitectura.map((node, i, arr) => `
            <div class="arch-node">${node}</div>
            ${i < arr.length - 1 ? '<div class="arch-arrow">→</div>' : ''}
          `).join('')}
        </div>
      </div>
    </section>

    <section id="objetivo-final">
      <h2>🚀 Objetivo Final</h2>
      <div class="card" style="background: linear-gradient(135deg, #1e293b, #1e3a8a); border: 1px solid var(--accent);">
        <p style="font-size: 1.2rem; text-align: center; font-weight: 500;">
          ${data.objetivoFinal}
        </p>
      </div>
    </section>
  `;
}

// ============================================================
// INICIALIZACIÓN
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  const content = document.getElementById('content');
  content.innerHTML = renderPipeline();
  
  // Smooth scroll para navegación
  document.querySelectorAll('nav a').forEach(link => {
  link.addEventListener('click', (e) => {
    const href = link.getAttribute('href');
    
    // Solo interceptar anclas internas (#)
    if (href && href.startsWith('#')) {
      e.preventDefault();
      const target = document.querySelector(href);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth' });
      }
    }
    // Los demás enlaces (index.html, /, externos) funcionan normal
  });
});
});

</script>



</body>
</html>
