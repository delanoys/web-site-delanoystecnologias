<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Clientes - Rey de los Aires y Lavadoras</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #0056b3; 
            --secondary: #28a745; 
            --dark: #333; 
            --bg-light: #f4f7f9;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--bg-light); 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            min-height: 100vh; 
        }

        /* --- Estilos de Navegación --- */
        header {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 1rem 5%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* --- Contenedor del Formulario --- */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }

        h2 { color: var(--primary); text-align: center; margin-top: 0; }
        p { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--dark); }
        
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--secondary); 
            border: none; 
            border-radius: 6px; 
            color: white; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px; 
        }

        button:hover { background-color: #218838; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #mensaje { 
            margin-top: 15px; 
            text-align: center; 
            padding: 10px; 
            border-radius: 6px; 
            display: none; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-snowflake"></i> 👑 Rey de los Aires y Lavadoras 🌊
            </div>
            <ul class="nav-links">
                <li><a href="/content/otros/airesylavadoras.html">Inicio</a></li>
                <li><a href="/content/otros/airesylavadoras.html#servicios">Servicios</a></li>
                <li><a href="/content/otros/airesylavadoras.html#productos">Ventas</a></li>
                <li><a href="/content/servicios/cliente.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <div class="container">
            <h2>❄️ ¡Solicita tu Servicio!</h2>
            <p>Completa tus datos para agendar la visita del técnico hoy mismo.</p>
            
            <form id="registroForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono / WhatsApp</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: 300 123 4567" required>
                </div>

                <div class="form-group">
                    <label for="servicio">¿Qué servicio necesitas?</label>
                    <select id="servicio" name="servicio">
                        <option value="Aire Nuevo">Aire Nuevo ($990k)</option>
                        <option value="Aire Usado">Aire Usado ($600k)</option>
                        <option value="Instalacion">Instalación Básica ($100k)</option>
                        <option value="Reparacion/Mantenimiento">Mantenimiento o Reparación</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección o Barrio</label>
                    <input type="text" id="direccion" name="direccion" placeholder="Ej: Calle 10 #20-30, Barrio El Prado" required>
                </div>

                <button type="submit" id="btnEnviar">ENVIAR SOLICITUD</button>
            </form>

            <div id="mensaje"></div>
        </div>
    </main>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxMY_OOndaVP-8HAEO7vbVfqL-rbNMSN4pF3pmia21NHn_eVXbwJzp7zNnQr2tuiZTf/exec';
        const form = document.getElementById('registroForm');
        const btn = document.getElementById('btnEnviar');
        const msg = document.getElementById('mensaje');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.disabled = true;
            btn.innerText = "Enviando datos...";

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: new FormData(form)
            })
            .then(() => {
                msg.style.display = "block";
                msg.style.backgroundColor = "#d4edda";
                msg.style.color = "#155724";
                msg.innerText = "✅ ¡Recibido! Nos comunicaremos en breve.";
                form.reset();
            })
            .catch(error => {
                console.error('Error!', error.message);
                msg.style.display = "block";
                msg.style.backgroundColor = "#f8d7da";
                msg.style.color = "#721c24";
                msg.innerText = "❌ Error al enviar. Intenta de nuevo.";
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerText = "ENVIAR SOLICITUD";
            });
        });
    </script>
</body>
</html>
