            /* Aumentamos el padding superior para acomodar la barra de progreso (aprox 90px) y la nueva barra de navegación (aprox 70px) */
            padding-top: 170px; 
        }
        
        /* Estilos específicos para la barra de navegación lateral en móvil */
        @media (max-width: 640px) {
            .nav-bar {
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 8px;
            }
            .nav-item {
                display: inline-block;
                flex: none;
            }
        }

        /* Estilo para el contenedor del checkbox */
        .progress-checkbox {
            cursor: pointer;
            appearance: none;
            width: 1.5rem;
            height: 1.5rem;
            border: 2px solid #6366f1; /* Indigo-500 */
            border-radius: 0.375rem; /* rounded-md */
            transition: all 0.2s ease-in-out;
        }
        /* Estilo cuando el checkbox está marcado */
        .progress-checkbox:checked {
            background-color: #6366f1; /* Indigo-500 */
            border-color: #6366f1;
            position: relative;
        }
        /* Simular el checkmark cuando está marcado */
        .progress-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1rem;
            font-weight: bold;
        }
        /* Estilo para el título de la tarea completada */
        .completed-task {
            text-decoration: line-through;
            color: #6b7280; /* Gray-500 */
        }
    </style>

        let progressState = {};
        let totalTopics = 0;

        // --- FUNCIONES PRINCIPALES ---

        /**
         * Inicializa el estado de progreso global y el contador total de temas.
         */
        function initializeProgress() {
            totalTopics = COURSE_DATA.reduce((count, module) => count + module.topics.length, 0);
            loadProgress();
            renderModules();
            renderModuleNavigation(); // Nueva función para renderizar la navegación
            updateGlobalProgress();
        }

        /**
         * Carga el estado de progreso desde localStorage.
         */
        function loadProgress() {
            const savedProgress = localStorage.getItem(STORAGE_KEY);
            if (savedProgress) {
                try {
                    progressState = JSON.parse(savedProgress);
                } catch (e) {
                    console.error("Error al parsear el progreso guardado:", e);
                    progressState = {};
                }
            } else {
                progressState = {};
            }
        }

        /**
         * Guarda el estado de progreso en localStorage.
         */
        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progressState));
        }

        /**
         * Calcula el porcentaje de progreso global y actualiza la barra.
         */
        function updateGlobalProgress() {
            const completedTopics = Object.values(progressState).filter(status => status).length;
            const percentage = totalTopics > 0 ? Math.round((completedTopics / totalTopics) * 100) : 0;

            const progressBar = document.getElementById('progress-bar');
            const progressPercentageText = document.getElementById('progress-percentage');

            progressBar.style.width = `${percentage}%`;
            progressPercentageText.textContent = `${percentage}%`;

            if (percentage === 100) {
                progressBar.classList.add('bg-green-500');
                progressBar.classList.remove('bg-indigo-500');
                progressPercentageText.classList.add('text-green-600');
                progressPercentageText.classList.remove('text-indigo-600');
            } else {
                progressBar.classList.add('bg-indigo-500');
                progressBar.classList.remove('bg-green-500');
                progressPercentageText.classList.add('text-indigo-600');
                progressPercentageText.classList.remove('text-green-600');
            }
        }
        
        /**
         * Renderiza la barra de navegación rápida con los módulos.
         */
        function renderModuleNavigation() {
            const navContainer = document.getElementById('module-nav-container');
            navContainer.innerHTML = '';
            
            COURSE_DATA.forEach(module => {
                const link = document.createElement('a');
                link.href = `#${module.id}`;
                link.className = 'nav-item bg-gray-700 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-1.5 rounded-full transition duration-150 shadow-md';
                link.textContent = module.id.split('-').pop(); // Muestra solo el número (e.g., "01", "02")
                link.title = module.title;
                navContainer.appendChild(link);
            });
            
             // Implementar desplazamiento suave para los enlaces de anclaje
             document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    
                    const targetId = this.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);
                    
                    if (targetElement) {
                        // Calcular la posición a la que debe desplazarse.
                        // Restamos la altura de las barras fijas (aprox 170px) para que el módulo sea visible.
                        const offset = 170; 
                        const targetPosition = targetElement.offsetTop - offset;

                        window.scrollTo({
                            top: targetPosition,
                            behavior: 'smooth'
                        });
                        
                        // Agregar el ID al historial para que se actualice la URL
                        history.pushState(null, null, this.getAttribute('href'));
                    }
                });
            });
        }


        /**
         * Renderiza todos los módulos y temas en el DOM.
         */
        function renderModules() {
            const container = document.getElementById('modules-container');
            container.innerHTML = ''; // Limpiar contenedor

            COURSE_DATA.forEach(module => {
                const moduleElement = document.createElement('div');
                moduleElement.className = 'bg-white rounded-xl shadow-md overflow-hidden';
                moduleElement.id = module.id; // Añadir ID para el anclaje

                // Header del Módulo
                const header = document.createElement('div');
                header.className = 'bg-indigo-50 p-5 border-b-2 border-indigo-200';
                
                // Título e Ícono (uso de íconos SVG simples ya que no cargamos Font Awesome)
                header.innerHTML = `
                    <h3 class="text-2xl font-bold text-indigo-700 mb-1 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                        </svg>
                        ${module.title}
                    </h3>
                    <p class="text-sm text-indigo-500">${module.description}</p>
                `;
                moduleElement.appendChild(header);

                // Lista de Temas
                const topicList = document.createElement('ul');
                topicList.className = 'divide-y divide-gray-200';

                module.topics.forEach(topic => {
                    const isCompleted = !!progressState[topic.id];
                    
                    const listItem = document.createElement('li');
                    listItem.className = 'p-4 hover:bg-gray-50 transition duration-150';

                    listItem.innerHTML = `
                        <label for="${topic.id}" class="flex items-center justify-between cursor-pointer">
                            <span class="flex-1 text-lg font-medium ${isCompleted ? 'completed-task' : 'text-gray-800'}">
                                ${topic.name}
                            </span>
                            <input type="checkbox" id="${topic.id}" data-topic-id="${topic.id}" 
                                class="progress-checkbox" ${isCompleted ? 'checked' : ''}>
                        </label>
                    `;
                    topicList.appendChild(listItem);
                });

                moduleElement.appendChild(topicList);
                container.appendChild(moduleElement);
            });
            
            // Adjuntar event listeners
            attachEventListeners();
        }

        /**
         * Adjunta el listener de cambio a todos los checkboxes.
         */
        function attachEventListeners() {
            document.querySelectorAll('.progress-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', handleCheckboxChange);
            });

            document.getElementById('reset-button').addEventListener('click', confirmReset);
        }

        /**
         * Maneja el cambio de estado de un checkbox.
         */
        function handleCheckboxChange(event) {
            const topicId = event.target.dataset.topicId;
            const isChecked = event.target.checked;
            
            progressState[topicId] = isChecked;
            
            // Actualizar el estilo del texto (tachado)
            const topicNameSpan = event.target.closest('label').querySelector('span');
            if (isChecked) {
                topicNameSpan.classList.add('completed-task');
                topicNameSpan.classList.remove('text-gray-800');
            } else {
                topicNameSpan.classList.remove('completed-task');
                topicNameSpan.classList.add('text-gray-800');
            }

            saveProgress();
            updateGlobalProgress();
        }
        
        /**
         * Maneja la acción de reinicio con una confirmación simple (sin alert()).
         */
        function confirmReset() {
             // Usamos window.confirm ya que no se permiten alerts, y este es un entorno de desarrollo.
             // Para un entorno de producción se usaría un modal custom.
             const result = window.confirm("¿Está seguro que desea borrar TODO su progreso? Esta acción no se puede deshacer.");
             if (result) {
                 resetProgress();
             }
        }

        /**
         * Resetea el progreso completo.
         */
        function resetProgress() {
            localStorage.removeItem(STORAGE_KEY);
            progressState = {};
            // Desmarcar todos los checkboxes en la UI
            document.querySelectorAll('.progress-checkbox').forEach(checkbox => {
                checkbox.checked = false;
                // Remover el estilo de completado
                const topicNameSpan = checkbox.closest('label').querySelector('span');
                topicNameSpan.classList.remove('completed-task');
                topicNameSpan.classList.add('text-gray-800');
            });
            updateGlobalProgress();
            
            // Mostrar un mensaje de confirmación simple
            document.getElementById('progress-percentage').textContent = '0%';
            const container = document.getElementById('progress-container');
            const existingMsg = document.getElementById('reset-msg');
            if (existingMsg) existingMsg.remove();
            
            container.insertAdjacentHTML('beforebegin', '<p id="reset-msg" class="text-sm text-center text-red-600 font-semibold mb-2">¡Progreso borrado con éxito!</p>');
            
            // Ocultar el mensaje después de 3 segundos
            setTimeout(() => {
                const msg = document.getElementById('reset-msg');
                if (msg) msg.remove();
            }, 3000);
        }

        // --- INICIO DE LA APLICACIÓN ---
        document.addEventListener('DOMContentLoaded', initializeProgress);
    </script>
</body>
</html>
