<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lectura Cronológica de la Biblia - 90 Días</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #333; }
    header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
    .container { padding: 20px; max-width: 1100px; margin: auto; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px; }
    .controls input { padding:8px; flex:1; }
    .controls button { padding:8px 12px; cursor:pointer; }
    .day { background: white; margin-bottom: 10px; padding: 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display:flex; gap:10px; align-items:flex-start; }
    .day.done { background:#e8f5e9; }
    .content { flex:1; }
    .label { font-weight: bold; color: #2c3e50; }
    textarea { width:100%; margin-top:6px; }
    .guide { background:#f1f8ff; padding:8px; border-radius:6px; margin-top:6px; font-size:14px; }
    .study { background:#fff8e1; padding:8px; border-radius:6px; margin-top:6px; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <h1>Lectura Cronológica de la Biblia</h1>
    <p>90 días + estudio profundo + herramienta de enseñanza</p>
  </header>

  <div class="container">

    <div class="controls">
      <input type="text" id="search" placeholder="Buscar día, libro o salmo...">
      <button onclick="resetProgress()">Reiniciar</button>
      <button onclick="window.print()">Exportar / PDF</button>
    </div>

    <div id="plan"></div>

  </div>

<script>
const plan = [];

const OT = [
"Génesis 1-3","Génesis 4-6","Génesis 7-9","Génesis 10-12","Génesis 13-15","Génesis 16-18","Génesis 19-21",
"Génesis 22-24","Génesis 25-27","Génesis 28-30","Génesis 31-33","Génesis 34-36","Génesis 37-39","Génesis 40-42",
"Génesis 43-45","Génesis 46-48","Génesis 49-50","Éxodo 1-3","Éxodo 4-6","Éxodo 7-9","Éxodo 10-12","Éxodo 13-15",
"Éxodo 16-18","Éxodo 19-21","Éxodo 22-24","Éxodo 25-27","Éxodo 28-29","Éxodo 30-32","Éxodo 33-35","Éxodo 36-40"
];

const Psalms = [8,19,32,46,29,33,105,34,37,23,1,121,20,24,91,103,27,40,63,84];

const NT = [
"Juan 1","Juan 2","Juan 3","Juan 4","Juan 5","Juan 6","Juan 7","Juan 8","Juan 9","Juan 10",
"Juan 11","Juan 12","Juan 13","Juan 14","Juan 15","Juan 16","Juan 17","Juan 18","Juan 19","Juan 20"
];

function guideText(ot){
  if(ot.includes("Génesis")) return "Origen, pecado y promesas.";
  if(ot.includes("Éxodo")) return "Liberación y poder de Dios.";
  return "Busca el carácter de Dios.";
}

function studyQuestions(){
  return `
    <b>Observación:</b> ¿Qué sucede en el texto?<br>
    <b>Interpretación:</b> ¿Qué significa?<br>
    <b>Aplicación:</b> ¿Cómo lo aplico hoy?<br>
    <b>Enseñanza:</b> ¿Cómo lo explicaría a un joven?
  `;
}

for(let i=0;i<90;i++){
  plan.push({
    day:i+1,
    ot:OT[i%OT.length],
    ps:"Salmo "+Psalms[i%Psalms.length],
    nt:NT[i%NT.length]
  });
}

const container = document.getElementById("plan");

function render(data){
  container.innerHTML="";
  data.forEach(d=>{
    const done = localStorage.getItem("day"+d.day);
    const notes = localStorage.getItem("note"+d.day)||"";

    const div=document.createElement("div");
    div.className="day"+(done?" done":"");

    div.innerHTML=`
      <input type="checkbox" ${done?"checked":""} onchange="toggle(${d.day}, this)">
      <div class="content">
        <h3>Día ${d.day}</h3>
        <div><span class="label">AT:</span> ${d.ot}</div>
        <div><span class="label">Salmo:</span> ${d.ps}</div>
        <div><span class="label">NT:</span> ${d.nt}</div>

        <div class="guide"><b>Guía:</b> ${guideText(d.ot)}</div>

        <div class="study">${studyQuestions()}</div>

        <textarea placeholder="Notas personales..." oninput="saveNote(${d.day}, this)">${notes}</textarea>
      </div>
    `;

    container.appendChild(div);
  });
}

function toggle(day, el){
  if(el.checked){
    localStorage.setItem("day"+day,true);
  } else {
    localStorage.removeItem("day"+day);
  }
  render(plan);
}

function saveNote(day, el){
  localStorage.setItem("note"+day, el.value);
}

function resetProgress(){
  if(confirm("¿Eliminar todo?")){
    localStorage.clear();
    render(plan);
  }
}

document.getElementById("search").addEventListener("input", function(){
  const val=this.value.toLowerCase();
  const filtered=plan.filter(d=>
    d.ot.toLowerCase().includes(val) ||
    d.nt.toLowerCase().includes(val) ||
    d.ps.toLowerCase().includes(val) ||
    ("día "+d.day).includes(val)
  );
  render(filtered);
});

render(plan);
</script>

</body>
</html>
